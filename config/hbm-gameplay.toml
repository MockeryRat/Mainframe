#Same as data/hbm/hbm/radiation_config/radiation.json in a datapack.
#A line changed here from its default replaces the datapack's value.
[radiation]
	#Default: 100.0
	fog_rad = 100.0
	#Default: 20.0
	fog_chance = 20.0
	world_rad_effects = true
	cleanup_dead_dirt = false
	enable_contamination = true
	enable_contamination_on_ground = true
	enable_chunk_rads = true
	neutron_activation = false
	#Default: 15
	neutron_activation_threshold = 15
	#Default: 10.0
	diffusivity = 10.0
	#Default: 120.0
	half_life_seconds = 120.0
	#Background radiation in the Nether, RAD/s (1.7.10: AMBIENT_00_nether). 0 turns it off.
	#Same as data/minecraft/hbm/radiation_settings/the_nether.json (ambient_rad). Read when the Nether loads: on a running server a change takes effect after a restart.
	# Default: 0.1
	# Range: 0.0 ~ 1000000.0
	nether_ambient_rad = 0.1

